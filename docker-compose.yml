version: '3.8'

services:
  # PostgreSQL - Solo para desarrollo local
  postgres:
    image: postgres:16-alpine
    container_name: poc-sdd-postgres
    environment:
      POSTGRES_DB: poc_sdd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API - Desarrollo local
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poc-sdd-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=poc_sdd;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro

volumes:
  postgres_data:
