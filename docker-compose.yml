version: '3.8'

services:
  # PostgreSQL - Solo para desarrollo local
  postgres:
    image: postgres:16-alpine
    container_name: poc-sdd-postgres
    environment:
      POSTGRES_DB: postgresql-db-ia-tests
      POSTGRES_USER: timeforsoftware@gmail.com
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeforsoftware@gmail.com -d postgresql-db-ia-tests"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API - Desarrollo local (en nginx-net para prod)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poc-sdd-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=postgresql-db-ia-tests;Username=timeforsoftware@gmail.com;Password=postgres
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    networks:
      - nginx-net
      - default

networks:
  nginx-net:
    external: true
    name: nginx-net

volumes:
  postgres_data:
